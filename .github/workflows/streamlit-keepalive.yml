name: Streamlit Keep-Alive & Liveness Ping

on:
  schedule:
    # Run twice a week at 08:00 UTC (Tuesdays and Fridays) to prevent free-tier app sleep
    - cron: "0 8 * * 2,5"
  workflow_dispatch:
    inputs:
      app_url:
        description: "Optional custom URL to ping"
        required: false
        default: ""

jobs:
  ping-streamlit:
    name: Ping Streamlit Cloud Instance
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        env:
          INPUT_URL: ${{ inputs.app_url }}
          SECRET_URL: ${{ secrets.STREAMLIT_APP_URL }}
          VAR_URL: ${{ vars.STREAMLIT_APP_URL }}
        run: |
          TARGET_URL="${INPUT_URL:-${SECRET_URL:-$VAR_URL}}"
          if [ -z "$TARGET_URL" ]; then
            echo "No STREAMLIT_APP_URL secret or variable configured. Skipping keep-alive ping."
            echo "To enable automatic keep-alive pings, add STREAMLIT_APP_URL in repo Settings -> Secrets and variables -> Actions."
            exit 0
          fi

          # Ensure https:// prefix if missing
          if [[ ! "$TARGET_URL" =~ ^https?:// ]]; then
            TARGET_URL="https://$TARGET_URL"
          fi

          # Sanitize URL: strip accidental /api/ or trailing paths to keep-alive base Streamlit domain
          BASE_URL=$(echo "$TARGET_URL" | sed -E 's#(https?://[^/]+).*#\1#')
          echo "Sanitized Streamlit Base URL: $BASE_URL"

          echo "Pinging Streamlit app at: $BASE_URL"
          HTTP_STATUS=$(curl -s -L -o /dev/null -w "%{http_code}" --max-time 30 "$BASE_URL")
          echo "Base URL Response HTTP Status: $HTTP_STATUS"

          # Also probe Streamlit core healthcheck endpoint
          HEALTH_URL="$BASE_URL/_stcore/health"
          HEALTH_STATUS=$(curl -s -L -o /dev/null -w "%{http_code}" --max-time 15 "$HEALTH_URL" || true)
          echo "Streamlit Health Endpoint ($HEALTH_URL) Status: $HEALTH_STATUS"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "Streamlit app is active and healthy!"
          elif [ "$HEALTH_STATUS" = "200" ]; then
            echo "Streamlit health check responded with HTTP 200 OK!"
          else
            echo "Warning: Received HTTP status $HTTP_STATUS from Streamlit app (Health: $HEALTH_STATUS)."
          fi
